name: Secret security
on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      full_history:
        description: 'Scan all fetched history (known revoked credentials will fail until remediation)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Checkout is owned by the host runner; trust only the mounted workspace.
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /github/workspace
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select only the introduced commit range
        id: scope
        run: node scripts/security-scan-range.cjs
      - name: Scan introduced commits with the official Gitleaks container action
        if: steps.scope.outputs.mode == 'git'
        uses: docker://ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f # v8.30.1
        with:
          args: >-
            git . --config=.gitleaks.toml
            --log-opts="${{ steps.scope.outputs.log_opts }}"
            --redact=100 --max-decode-depth=3 --no-banner --log-level=error
      - name: Scan current files on manual request
        if: steps.scope.outputs.mode == 'dir'
        uses: docker://ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f # v8.30.1
        with:
          args: dir . --config=.gitleaks.toml --redact=100 --max-decode-depth=3 --no-banner --log-level=error
